# Ocean Live app server: "Any questions?", accounts and the web account page.
name = "ocean-live-ask"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]
# Older app builds use the workers.dev address, so it stays on.
workers_dev = true
# api.oceanlive.org: the app API. account.oceanlive.org: the web account page.
# admin.oceanlive.org: the admin page (Google sign-in only, admins only).
routes = [
  { pattern = "api.oceanlive.org", custom_domain = true },
  { pattern = "account.oceanlive.org", custom_domain = true },
  { pattern = "admin.oceanlive.org", custom_domain = true },
]

# The web account page. The Worker runs first on every request and only serves these files
# when the host is account.oceanlive.org; on other hosts the same paths are 404.
# The admin page (admin/) is not in here: its files are bundled into the Worker (rule below) and
# only served on admin.oceanlive.org.
[assets]
directory = "./account"
binding = "ASSETS"
run_worker_first = true

# The knowledge guide and the admin page's files ("...?raw" imports) are bundled into the Worker as text.
[[rules]]
type = "Text"
globs = ["**/*.md", "**/*?raw"]
fallthrough = false

# Counters (per device, per network, monthly spend) and the fault code table.
# The id stays a placeholder here: the Cloudflare build fills it in from the build variable
# ASK_KV_ID (scripts/fill-ids.mjs). It is the id `npx wrangler kv namespace create ASK_KV` printed.
[[kv_namespaces]]
binding = "ASK_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# Research log of questions and answers (see migrations/ and PRIVACY.md).
# The id stays a placeholder here: the Cloudflare build fills it in from the build variable
# ASK_D1_ID (scripts/fill-ids.mjs). It is the id `npx wrangler d1 create ocean-live-ask-log` printed.
[[d1_databases]]
binding = "LOG_DB"
database_name = "ocean-live-ask-log"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

# Every day at 03:17 UTC: delete log entries older than LOG_RETENTION_DAYS.
[triggers]
crons = ["17 3 * * *"]

# Every deploy gives the live Worker these values. GOOGLE_WEB_CLIENT_ID, GOOGLE_IOS_CLIENT_ID and
# REVIEW_EMAIL stay empty here: the Cloudflare build fills them in from build variables of the same
# names (scripts/fill-ids.mjs).
[vars]
# Days to keep the research log. PRIVACY.md promises 90; change both together.
LOG_RETENTION_DAYS = "90"
# Accounts. Answer questions from apps without an account (3.4)?
# Set to "false" once the account update has been out for a while.
ALLOW_ANONYMOUS = "true"
# Sign in with Apple: the iPhone app's bundle ID.
APPLE_AUDIENCES = "com.justice.OceanABRP"
# Sign in with Google: your OAuth client IDs. Empty hides Google.
GOOGLE_WEB_CLIENT_ID = ""
GOOGLE_IOS_CLIENT_ID = ""
# Email codes: the sender, on a domain verified in Resend. Email sign-in only shows once the
# secret RESEND_API_KEY is also set.
EMAIL_FROM = "Ocean Live <login@oceanlive.org>"
# The proxy stops answering once this many US dollars were spent in a calendar month (UTC).
MONTHLY_CAP_USD = "10"
# "Any questions?" may search the web and read pages when the guide doesn't cover something (Anthropic's
# web search and web fetch tools; the sources used are listed under the answer). "false" turns both off.
# Signed-in accounts only: questions without an account (older app builds) never use web search or GitHub.
WEB_TOOLS = "true"
# Web searches per question. Each costs US$0.01 on top of the tokens and counts toward MONTHLY_CAP_USD and a
# paid question's charge. Once a question has made this many, Claude answers with what it has; a single call
# to Claude can't be stopped halfway, so now and then a question makes a few more (QUESTION_MAX_CENTS bounds
# the cost). At most 10. "0" leaves web search out (reading pages stays, at most 2 pages per question).
WEB_MAX_SEARCHES = "3"
# Once a question has cost this many US cents, it asks for nothing more (no more searches, pages, GitHub
# lookups or continuations): one last call without tools writes the answer from what it has. That call and the
# one that crossed the limit still count, so a question can go over by about that much. A paid question also
# stops at the owner's balance. Most questions cost 1-3 cents, ones that search the web 5-15.
QUESTION_MAX_CENTS = "20"
# Public GitHub repositories "Any questions?" may read for questions about Ocean Live itself (issues, pull
# requests, releases and files), comma-separated "owner/name". Empty turns the GitHub tool off.
# Signed-in accounts only, like web search.
GITHUB_REPOS = "JusticeRox98577/Fisker-Ocean-Apps"
# Questions per app install per day (UTC).
DEVICE_DAILY_LIMIT = "10"
# Questions per network (IP address) per day, across installs.
IP_DAILY_LIMIT = "40"
# Balance: once the free questions of the day are used up, signed-in accounts pay from their balance
# (the answer's cost rounded up to the next cent). At most this many paid questions per account per day.
PAID_DAILY_LIMIT = "50"
# A paid question is only asked with at least this many cents in the balance.
PAID_MIN_BALANCE_CENTS = "3"
# Store rewards (US$5 + Early supporter badge). The Play reward product (one-time product).
PLAY_REWARD_PRODUCT = "prereg_credit_5"
# Last day rewards can be claimed (UTC date, e.g. "2027-12-31"). Empty: open.
REWARD_CLAIM_UNTIL = ""
# Testing only: "true" also accepts Play test purchases / App Store Sandbox pre-orders. Keep "false".
PLAY_ALLOW_TEST = "false"
APPLE_ALLOW_SANDBOX = "false"
# The iPhone app's Apple ID (the number in App Store Connect). When set, App Store rewards must match it.
APPLE_APP_ID = ""
# "Report this answer": new reports per account (or install) per day.
REPORT_DAILY_LIMIT = "20"
# Store review sign-in: with this address AND the secret REVIEW_CODE set, a code requested for this
# address is not emailed; REVIEW_CODE is the code. Empty: off. This account never gets rewards or a balance.
REVIEW_EMAIL = ""
# Admin page (admin.oceanlive.org): balance, badge and admin changes per admin per day.
ADMIN_WRITE_LIMIT = "100"

# Secrets, set with `npx wrangler secret put <NAME>`, never written here:
#   ANTHROPIC_API_KEY  your Anthropic API key
#   IP_SALT            any long random string, used to hash IP addresses and email codes
#   RESEND_API_KEY     your Resend API key, for email sign-in codes
#   GOOGLE_PLAY_SERVICE_ACCOUNT  the Google Cloud service account's JSON key, to check Play rewards
#   REVIEW_CODE        6 digits: the sign-in code for REVIEW_EMAIL (store review)
#   ADMIN_EMAILS       the owners' Google addresses, comma-separated (admin.oceanlive.org)
#   GITHUB_TOKEN       optional but recommended: a GitHub token with read-only access to public repositories,
#                      for GitHub's higher rate limits when "Any questions?" reads GITHUB_REPOS. Without it,
#                      unauthenticated (about 10 searches a minute, shared with other Cloudflare customers).
