name: Site

# oceanlive.org: checks the site and deploys it to Cloudflare. A site-only deploy keeps the
# APK downloads (stable and preview) that are live, see site/tools/deploy.mjs.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # One queue with the Android publish job, so deploys never overlap.
    concurrency:
      group: oceanlive-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the site
        run: node site/tools/check-site.mjs
      - name: Deploy to oceanlive.org
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Deploying needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."; exit 1
          fi
          node site/tools/deploy.mjs
          echo "Deployed https://oceanlive.org from ${GITHUB_SHA::7}; downloads kept as they were." >> "$GITHUB_STEP_SUMMARY"
