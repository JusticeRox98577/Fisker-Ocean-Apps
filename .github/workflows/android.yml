name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # On the build job, not the workflow, so a newer run never cancels a deploy in progress.
    # A newer push cancels an older push build, but never a manual release build (its own group,
    # never cancelled), so an ordinary push cannot silently drop a release.
    concurrency:
      group: android-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: write
    outputs:
      apks: ${{ steps.sign.outputs.apks }}
      version: ${{ steps.version.outputs.version }}
      short: ${{ steps.version.outputs.short }}
    env:
      # "Any questions?" proxy address (repository variable, see ask-proxy/README.md). Empty hides the button.
      OCEAN_ASK_URL: ${{ vars.OCEAN_ASK_URL }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set build number and version
        id: version
        # The version comes from the app (versionName), so file and release names follow it.
        run: |
          echo "BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          test -n "$VERSION" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT=${VERSION%.0}" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=${VERSION%.0}" >> "$GITHUB_OUTPUT"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build and sign with the upload key
        id: sign
        # Only the owner's upload key signs Ocean Live. Without the key secrets this is a
        # compile check only (debug builds, no APKs), and a manual release run fails.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
          # Optional repository variable: the upload certificate's SHA-256, so a wrong key fails the build.
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ "$RELEASE" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/release-* ]]; then
            echo "Releases are only built from main or a release-x.y.z tag."; exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "A release needs the ANDROID_* upload key secrets."; exit 1
            fi
            echo "No upload key secrets: compile check only, no APKs." >> "$GITHUB_STEP_SUMMARY"
            ./gradlew :app:assembleDebug :wear:assembleDebug
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          TASKS=":app:assembleRelease :wear:assembleRelease"
          if [ "$RELEASE" = "true" ]; then TASKS="$TASKS :app:bundleRelease :wear:bundleRelease"; fi
          ANDROID_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew $TASKS
          cp app/build/outputs/apk/release/app-release.apk OceanLive-$SHORT-Android.apk
          cp wear/build/outputs/apk/release/wear-release.apk OceanLive-$SHORT-Wear.apk
          if [ "$RELEASE" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab OceanLive-$SHORT-Play.aab
            # The watch app goes to Play as its own bundle (Wear OS form factor), same key.
            cp wear/build/outputs/bundle/release/wear-release.aab OceanLive-$SHORT-Wear-Play.aab
          fi
          # Show which certificate signed the APKs, so a wrong key is obvious in the log.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in OceanLive-$SHORT-Android.apk OceanLive-$SHORT-Wear.apk; do
            echo "== $f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "certificate (DN|SHA-256)"
            if [ -n "$EXPECTED_CERT" ]; then
              GOT=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 "certificate SHA-256" | awk '{print $NF}')
              WANT=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
              [ "$GOT" = "$WANT" ] || { echo "$f is not signed with the expected certificate."; exit 1; }
            fi
          done
          echo "apks=true" >> "$GITHUB_OUTPUT"
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Android
          path: |
            android/OceanLive-${{ env.SHORT }}-Android.apk
            android/OceanLive-${{ env.SHORT }}-Wear.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: OceanLive-Play-bundle
          path: |
            android/OceanLive-${{ env.SHORT }}-Play.aab
            android/OceanLive-${{ env.SHORT }}-Wear-Play.aab
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="OceanLive-$SHORT-Android.apk OceanLive-$SHORT-Wear.apk"
          # Release notes: this version's section of CHANGELOG.md, plus the standard footer.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "No CHANGELOG.md section for $VERSION." > "$RUNNER_TEMP/notes.md"; fi
          {
            echo
            echo "Files: OceanLive-$SHORT-Android.apk (phone) and OceanLive-$SHORT-Wear.apk (Wear OS), both signed with the official Ocean Live key."
            echo
            echo "No account and no tracking. The only network use is questions you ask in Any questions? and optional ABRP live data. Built from ${{ github.sha }}."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION-build-${{ github.run_number }}" $FILES \
            --latest \
            --title "Ocean Live $SHORT (build ${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md"

  # The signed APKs on oceanlive.org: a manual release run updates the public download
  # (/downloads/), a push to main updates the unlisted preview (/downloads/preview/).
  # GitHub releases are unchanged. Shares one queue with site.yml, so deploys never overlap.
  publish:
    name: Publish to oceanlive.org
    needs: build
    if: >-
      needs.build.outputs.apks == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/release-'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: oceanlive-deploy
      cancel-in-progress: false
    steps:
      # The site files (and deploy.mjs) always come from the current main, never from this run's
      # commit or tag: wrangler replaces every file, and this job can start minutes after the
      # build, so an older checkout would roll back site changes deployed by site.yml meanwhile.
      # Only the APKs come from this run (the artifact below).
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: site
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          name: OceanLive-Android
          path: ${{ runner.temp }}/apks
      - name: Publish to oceanlive.org
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && 'stable' || 'preview' }}
          VERSION: ${{ needs.build.outputs.version }}
          SHORT: ${{ needs.build.outputs.short }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            if [ "$CHANNEL" = "stable" ]; then
              echo "::error::A release needs the CLOUDFLARE_API_TOKEN secret and the CLOUDFLARE_ACCOUNT_ID variable."; exit 1
            fi
            echo "No Cloudflare token or account ID: the preview was not published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node site/tools/deploy.mjs --channel "$CHANNEL" \
            --android "$RUNNER_TEMP/apks/OceanLive-$SHORT-Android.apk" \
            --wear "$RUNNER_TEMP/apks/OceanLive-$SHORT-Wear.apk" \
            --version "$VERSION" --build "$GITHUB_RUN_NUMBER" --commit "$GITHUB_SHA"
          DIR=downloads/
          if [ "$CHANNEL" = "preview" ]; then DIR=downloads/preview/; fi
          {
            echo "Published Ocean Live $SHORT (build $GITHUB_RUN_NUMBER) to the $CHANNEL channel:"
            echo
            echo "* https://oceanlive.org/${DIR}OceanLive-Android.apk"
            echo "* https://oceanlive.org/${DIR}OceanLive-Wear.apk"
            echo "* https://oceanlive.org/${DIR}latest.json"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitHub keeps only one pending run per concurrency group, so while a deploy is running a
  # newer site.yml or preview deploy can cancel a queued stable publish. The GitHub release
  # already exists by then, so make that loud: this job fails and says how to recover.
  publish-cancelled:
    name: Check the oceanlive.org publish
    needs: [build, publish]
    if: always() && github.event_name == 'workflow_dispatch' && needs.publish.result == 'cancelled'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The stable download was not updated
        run: |
          echo "::error::The publish job was cancelled (another deploy took its place in the oceanlive-deploy queue), so oceanlive.org still offers the previous release. Use Re-run failed jobs on this run to publish it."
          exit 1
