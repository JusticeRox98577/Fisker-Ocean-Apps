name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set build number and version
        # The version comes from the app (versionName), so file and release names follow it.
        run: |
          echo "BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          test -n "$VERSION" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT=${VERSION%.0}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build APK
        # Signed with the public test key in android/dev-debug.keystore, same as
        # the 2.0 GitHub APKs, so it installs over a sideloaded 2.0.
        run: |
          ./gradlew :app:assembleRelease :wear:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk OceanLive-$SHORT-Android.apk
          cp wear/build/outputs/apk/release/wear-release.apk OceanLive-$SHORT-Wear.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Android
          path: |
            android/OceanLive-${{ env.SHORT }}-Android.apk
            android/OceanLive-${{ env.SHORT }}-Wear.apk
      - name: Build Play bundle and signed APK
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload key secrets set, skipping the Play bundle and signed APK." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          ANDROID_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew :app:bundleRelease :app:assembleRelease :wear:bundleRelease :wear:assembleRelease
          cp app/build/outputs/bundle/release/app-release.aab OceanLive-$SHORT-Play.aab
          # The watch app goes to Play as its own bundle (Wear OS form factor), same key.
          cp wear/build/outputs/bundle/release/wear-release.aab OceanLive-$SHORT-Wear-Play.aab
          cp wear/build/outputs/apk/release/wear-release.apk OceanLive-$SHORT-Wear-signed.apk
          # The same app signed with the upload key, for installing directly instead of through the Play Store.
          cp app/build/outputs/apk/release/app-release.apk OceanLive-$SHORT-Android-signed.apk
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: OceanLive-Play-bundle
          path: |
            android/OceanLive-${{ env.SHORT }}-Play.aab
            android/OceanLive-${{ env.SHORT }}-Android-signed.apk
            android/OceanLive-${{ env.SHORT }}-Wear-Play.aab
            android/OceanLive-${{ env.SHORT }}-Wear-signed.apk
          if-no-files-found: ignore
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="OceanLive-$SHORT-Android.apk OceanLive-$SHORT-Wear.apk"
          if [ -f OceanLive-$SHORT-Android-signed.apk ]; then FILES="$FILES OceanLive-$SHORT-Android-signed.apk"; fi
          if [ -f OceanLive-$SHORT-Wear-signed.apk ]; then FILES="$FILES OceanLive-$SHORT-Wear-signed.apk"; fi
          gh release create "v$VERSION-build-${{ github.run_number }}" $FILES \
            --latest \
            --title "Ocean Live $SHORT (build ${{ github.run_number }})" \
            --notes "The Wear OS app is OceanLive-$SHORT-Wear.apk. No account and no cloud. The only network use is optional ABRP live data. Built from ${{ github.sha }}."
