name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Set build number and version
        # The version comes from the app (versionName), so file and release names follow it.
        run: |
          echo "BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          test -n "$VERSION" || { echo "versionName not found in app/build.gradle.kts"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "SHORT=${VERSION%.0}" >> "$GITHUB_ENV"
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Build and sign with the upload key
        # Only the owner's upload key signs Ocean Live. Without the key secrets this is a
        # compile check only (debug builds, no APKs), and a manual release run fails.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' }}
          # Optional repository variable: the upload certificate's SHA-256, so a wrong key fails the build.
          EXPECTED_CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          if [ "$RELEASE" = "true" ] && [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/release-* ]]; then
            echo "Releases are only built from main or a release-x.y.z tag."; exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$RELEASE" = "true" ]; then
              echo "A release needs the ANDROID_* upload key secrets."; exit 1
            fi
            echo "No upload key secrets: compile check only, no APKs." >> "$GITHUB_STEP_SUMMARY"
            ./gradlew :app:assembleDebug :wear:assembleDebug
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          TASKS=":app:assembleRelease :wear:assembleRelease"
          if [ "$RELEASE" = "true" ]; then TASKS="$TASKS :app:bundleRelease :wear:bundleRelease"; fi
          ANDROID_STORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew $TASKS
          cp app/build/outputs/apk/release/app-release.apk OceanLive-$SHORT-Android.apk
          cp wear/build/outputs/apk/release/wear-release.apk OceanLive-$SHORT-Wear.apk
          if [ "$RELEASE" = "true" ]; then
            cp app/build/outputs/bundle/release/app-release.aab OceanLive-$SHORT-Play.aab
            # The watch app goes to Play as its own bundle (Wear OS form factor), same key.
            cp wear/build/outputs/bundle/release/wear-release.aab OceanLive-$SHORT-Wear-Play.aab
          fi
          # Show which certificate signed the APKs, so a wrong key is obvious in the log.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in OceanLive-$SHORT-Android.apk OceanLive-$SHORT-Wear.apk; do
            echo "== $f"; "$APKSIGNER" verify --print-certs "$f" | grep -E "certificate (DN|SHA-256)"
            if [ -n "$EXPECTED_CERT" ]; then
              GOT=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 "certificate SHA-256" | awk '{print $NF}')
              WANT=$(printf '%s' "$EXPECTED_CERT" | tr -d ': ' | tr 'A-F' 'a-f')
              [ "$GOT" = "$WANT" ] || { echo "$f is not signed with the expected certificate."; exit 1; }
            fi
          done
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Android
          path: |
            android/OceanLive-${{ env.SHORT }}-Android.apk
            android/OceanLive-${{ env.SHORT }}-Wear.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: OceanLive-Play-bundle
          path: |
            android/OceanLive-${{ env.SHORT }}-Play.aab
            android/OceanLive-${{ env.SHORT }}-Wear-Play.aab
      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="OceanLive-$SHORT-Android.apk OceanLive-$SHORT-Wear.apk"
          # Release notes: this version's section of CHANGELOG.md, plus the standard footer.
          awk -v v="$VERSION" '$0 == "## " v {on=1; next} /^## / {on=0} on' ../CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then echo "No CHANGELOG.md section for $VERSION." > "$RUNNER_TEMP/notes.md"; fi
          {
            echo
            echo "Files: OceanLive-$SHORT-Android.apk (phone) and OceanLive-$SHORT-Wear.apk (Wear OS), both signed with the official Ocean Live key."
            echo
            echo "No account and no cloud. The only network use is optional ABRP live data. Built from ${{ github.sha }}."
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION-build-${{ github.run_number }}" $FILES \
            --latest \
            --title "Ocean Live $SHORT (build ${{ github.run_number }})" \
            --notes-file "$RUNNER_TEMP/notes.md"
