name: Ocean Live Android

on:
  push:
    branches: [main]
    paths:
      - "ocean-live/android/**"
      - ".github/workflows/ocean-live-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocean-live/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OceanLiveDev-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLiveDev-apk
          path: ocean-live/android/OceanLiveDev-${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "dev-${{ github.run_number }}" "OceanLiveDev-${{ github.run_number }}.apk" \
            --prerelease \
            --title "Ocean Live Dev build ${{ github.run_number }}" \
            --notes "Dev build for testing new features, from ${{ github.sha }}. It installs next to the public Ocean Live app."
