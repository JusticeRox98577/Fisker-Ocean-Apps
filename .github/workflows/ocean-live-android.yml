name: Ocean Live Flutter
on:
  push:
    branches: [main, flutter-migration]
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-android.yml"]
  pull_request:
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  android:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build obfuscated Dev APK
        run: |
          flutter build apk --flavor dev --release --obfuscate --split-debug-info=build/symbols/android --dart-define=OCEAN_DEV=true --build-number=$((2000 + GITHUB_RUN_NUMBER))
          cp build/app/outputs/flutter-apk/app-dev-release.apk OceanLiveDev-Flutter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLiveDev-Flutter-android
          path: ocean-live/flutter/OceanLiveDev-Flutter.apk
      - name: Encrypt crash symbols
        env:
          SYMBOLS_ENCRYPTION_PASSWORD: ${{ secrets.SYMBOLS_ENCRYPTION_PASSWORD }}
        run: bash tool/archive_symbols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-symbols-android
          path: ocean-live/flutter/build/private-artifacts/*.enc
          if-no-files-found: ignore
      - name: Save draft Dev release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flutter-dev-${{ github.run_number }}" OceanLiveDev-Flutter.apk --draft --title "Ocean Live Flutter Dev ${{ github.run_number }}" --notes "Shared Flutter app from ${{ github.sha }}. Obfuscated release build signed with the existing Dev key."
