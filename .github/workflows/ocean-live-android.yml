name: Ocean Live Flutter
on:
  push:
    branches: [main]
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
  android:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Build public Android APK (no test features)
        env:
          ALLOW_PUBLIC_KEY_SIGNING: 'true'
        run: |
          flutter build apk --flavor prod --release --obfuscate --split-debug-info=build/symbols/android --dart-define=OCEAN_DEV=false --build-number=$((2000 + GITHUB_RUN_NUMBER))
          cp build/app/outputs/flutter-apk/app-prod-release.apk OceanLive-2.0-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Android
          path: ocean-live/flutter/OceanLive-2.0-Android.apk
      - name: Encrypt crash symbols
        env:
          SYMBOLS_ENCRYPTION_PASSWORD: ${{ secrets.SYMBOLS_ENCRYPTION_PASSWORD }}
        run: bash tool/archive_symbols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-symbols-android
          path: ocean-live/flutter/build/private-artifacts/*.enc
          if-no-files-found: ignore
      - name: Publish release
        # Every push to main still builds and tests, but only publishing a
        # public release is held back until it's manually triggered (Actions
        # tab -> Run workflow), so pushing new features doesn't ship them to
        # the public release until it's actually ready.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v2.0-build-${{ github.run_number }}" OceanLive-2.0-Android.apk --latest --title "Ocean Live 2.0 (build ${{ github.run_number }})" --notes "Public Ocean Live 2.0 for Android from ${{ github.sha }}. Obfuscated release build with no test or dev tools."
