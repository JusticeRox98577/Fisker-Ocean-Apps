name: Ocean Live Flutter iOS
on:
  push:
    branches: [main, flutter-migration]
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-ios.yml"]
  pull_request:
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-ios.yml"]
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Sign and upload to TestFlight (requires signing secrets)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: flutter-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build obfuscated iPhone app
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios --build-number=$((2000 + GITHUB_RUN_NUMBER))
      - name: Package unsigned build for inspection
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app OceanLive-iOS-unsigned.app.zip
          echo "The automatic iOS artifact is unsigned. Use the manual TestFlight option for an installable signed build." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Flutter-iOS-unsigned
          path: ocean-live/flutter/OceanLive-iOS-unsigned.app.zip
      - name: Install iOS signing material
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          IOS_DISTRIBUTION_P12: ${{ secrets.IOS_DISTRIBUTION_P12 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$IOS_DISTRIBUTION_P12" && test -n "$IOS_PROVISION_PROFILE_BASE64" && test -n "$ASC_KEY_P8" || { echo "Missing iOS signing secrets"; exit 1; }
          printf '%s' "$IOS_DISTRIBUTION_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ocean.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ocean.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ocean.keychain-db"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$RUNNER_TEMP/ocean.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/ocean.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/ocean.keychain-db" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$RUNNER_TEMP/keys"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/Ocean.mobileprovision"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Archive and upload TestFlight build
        if: github.event_name == 'workflow_dispatch' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          flutter build ipa --release --obfuscate --split-debug-info=build/symbols/ios --build-number=$((2000 + GITHUB_RUN_NUMBER)) --export-options-plist=ios/ExportOptions.plist
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" -API_PRIVATE_KEYS_DIR "$RUNNER_TEMP/keys"
      - name: Encrypt crash symbols
        env:
          SYMBOLS_ENCRYPTION_PASSWORD: ${{ secrets.SYMBOLS_ENCRYPTION_PASSWORD }}
        run: bash tool/archive_symbols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-symbols-ios
          path: ocean-live/flutter/build/private-artifacts/*.enc
          if-no-files-found: ignore
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ocean.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/keys/"*.p8
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/Ocean.mobileprovision"
