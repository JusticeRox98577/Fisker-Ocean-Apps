name: Ocean Live Flutter iOS
on:
  push:
    branches: [main, flutter-migration, release-2.0]
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-ios.yml"]
  pull_request:
    paths: ["ocean-live/flutter/**", ".github/workflows/ocean-live-ios.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ocean-live/flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Build obfuscated iPhone app
        run: flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols/ios --build-number=$((2000 + GITHUB_RUN_NUMBER))
      - name: Package unsigned build for inspection
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app OceanLive-iOS-unsigned.app.zip
          echo "The automatic iOS artifact is unsigned. Use the manual TestFlight option for an installable signed build." >> "$GITHUB_STEP_SUMMARY"
      - name: Package unsigned IPA for sideloading
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry OceanLive-2.0-iOS-unsigned.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-iOS
          path: |
            ocean-live/flutter/OceanLive-2.0-iOS-unsigned.ipa
            ocean-live/flutter/OceanLive-iOS-unsigned.app.zip
      - name: Archive, sign and upload to App Store Connect
        if: github.event_name != 'pull_request'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          test -n "$ASC_KEY_P8" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" || { echo "Missing ASC_KEY_P8, ASC_KEY_ID or ASC_ISSUER_ID secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Runner.xcarchive" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Runner.xcarchive" -exportOptionsPlist ios/ExportOptions.plist -exportPath build/ios/ipa $AUTH
          xcrun altool --upload-app --type ios -f build/ios/ipa/*.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" -API_PRIVATE_KEYS_DIR "$RUNNER_TEMP/keys"
      - name: Encrypt crash symbols
        env:
          SYMBOLS_ENCRYPTION_PASSWORD: ${{ secrets.SYMBOLS_ENCRYPTION_PASSWORD }}
        run: bash tool/archive_symbols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-symbols-ios
          path: ocean-live/flutter/build/private-artifacts/*.enc
          if-no-files-found: ignore
      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"