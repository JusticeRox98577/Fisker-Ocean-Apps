name: Ocean Live Flutter Play bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play_bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ocean-live/flutter
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - name: Prepare production signing
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEY_ALIAS" || { echo "Configure the Android upload-key secrets before building a Play bundle"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ocean-upload.jks"
          echo "ANDROID_STORE_FILE=$RUNNER_TEMP/ocean-upload.jks" >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - run: flutter build appbundle --flavor prod --release --obfuscate --split-debug-info=build/symbols/android --dart-define=OCEAN_DEV=false --build-number=$((2000 + GITHUB_RUN_NUMBER))
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-Play-bundle
          path: ocean-live/flutter/build/app/outputs/bundle/prodRelease/*.aab
      - name: Draft release with the Play bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/bundle/prodRelease/*.aab OceanLive-Play-bundle.aab
          gh release create "play-bundle-${{ github.run_number }}" OceanLive-Play-bundle.aab --draft --title "Ocean Live Play bundle (build ${{ github.run_number }})" --notes "Signed .aab for Google Play Console, built from ${{ github.sha }}."
      - name: Encrypt crash symbols
        env:
          SYMBOLS_ENCRYPTION_PASSWORD: ${{ secrets.SYMBOLS_ENCRYPTION_PASSWORD }}
        run: bash tool/archive_symbols.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-symbols-play
          path: ocean-live/flutter/build/private-artifacts/*.enc
          if-no-files-found: ignore
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/ocean-upload.jks"
