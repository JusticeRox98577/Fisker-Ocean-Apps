name: Ocean Live Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocean-live/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Sign with the repo test key
        run: |
          printf 'storeFile=dev-debug.keystore\nstorePassword=android\nkeyAlias=oceanlivedev\nkeyPassword=android\n' > keystore.properties
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Name the APK
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk OceanLive-$VER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-apk
          path: ocean-live/android/OceanLive-${{ env.VER }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VER}-${{ github.run_number }}" "OceanLive-${VER}.apk" \
            --title "Ocean Live ${VER}" \
            --notes "Public Ocean Live build, from ${{ github.sha }}. Signed with the repo test key, so it installs as a separate sideloaded app and will not update a Google Play install."
