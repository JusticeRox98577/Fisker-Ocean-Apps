name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Use Xcode 26
        # App Store Connect only accepts builds made with the iOS 26 SDK or later.
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -viE 'beta|release_candidate|_rc' | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "No stable Xcode 26 on this runner. Installed:"; ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
          echo "BUILD_NUMBER=$((3000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
      - name: Build (unsigned)
        run: |
          xcodebuild -project OceanLive.xcodeproj -scheme OceanLive -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= build
      - name: Package unsigned IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/OceanLive.app Payload/
          zip -qry OceanLive-3.2-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: OceanLive-iOS-unsigned
          path: ios/OceanLive-3.2-iOS-unsigned.ipa
      - name: Archive, sign and upload to TestFlight
        if: github.event_name == 'workflow_dispatch'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "No App Store Connect secrets set, skipping TestFlight." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" > "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          # Archive unsigned and sign only at export (distribution). Signing the archive makes Xcode
          # create a development certificate, and the account is at its certificate limit.
          xcodebuild -project OceanLive.xcodeproj -scheme OceanLive -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/OceanLive.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD_NUMBER \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= archive
          # An unsigned archive carries no entitlements, and export only re-signs what is there.
          # Ad-hoc sign it with ours (no certificate needed) so the CarPlay and App Group entitlements
          # survive export. Inside-out: the widget extension first, then the app around it.
          ARCHIVED_APP="$RUNNER_TEMP/OceanLive.xcarchive/Products/Applications/OceanLive.app"
          ARCHIVED_WIDGETS="$ARCHIVED_APP/PlugIns/OceanLiveWidgets.appex"
          if [ ! -d "$ARCHIVED_WIDGETS" ]; then
            echo "The archive is missing the widget extension:"; ls -la "$ARCHIVED_APP/PlugIns" || true
            exit 1
          fi
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements OceanLiveWidgets/OceanLiveWidgets.entitlements "$ARCHIVED_WIDGETS"
          codesign -d --entitlements - --xml "$ARCHIVED_WIDGETS" | grep -q application-groups
          codesign --force --sign - --timestamp=none --generate-entitlement-der \
            --entitlements OceanLive/OceanLive.entitlements "$ARCHIVED_APP"
          codesign -d --entitlements - --xml "$ARCHIVED_APP" | grep -q carplay-driving-task
          codesign -d --entitlements - --xml "$ARCHIVED_APP" | grep -q application-groups
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/OceanLive.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath build/ipa $AUTH
          # The signed app must carry the CarPlay entitlement, or CarPlay won't show the app.
          rm -rf "$RUNNER_TEMP/check" && mkdir -p "$RUNNER_TEMP/check"
          unzip -q build/ipa/*.ipa -d "$RUNNER_TEMP/check"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/check/Payload/OceanLive.app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          if ! grep -q "com.apple.developer.carplay-driving-task" "$RUNNER_TEMP/entitlements.plist"; then
            echo "The exported app is missing the CarPlay entitlement. Signed entitlements:"
            cat "$RUNNER_TEMP/entitlements.plist"
            exit 1
          fi
          echo "CarPlay entitlement present."
          if ! grep -q "com.apple.security.application-groups" "$RUNNER_TEMP/entitlements.plist"; then
            echo "The exported app is missing the App Group entitlement. Signed entitlements:"
            cat "$RUNNER_TEMP/entitlements.plist"
            exit 1
          fi
          echo "App Group entitlement present."
          echo "Widget extension entitlements:"
          codesign -d --entitlements - --xml "$RUNNER_TEMP/check/Payload/OceanLive.app/PlugIns/OceanLiveWidgets.appex" 2>/dev/null || true
          echo
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/keys" xcrun altool --upload-app --type ios -f build/ipa/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
