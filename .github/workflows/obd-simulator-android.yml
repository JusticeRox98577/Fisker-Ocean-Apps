name: OBD Simulator Android

on:
  push:
    branches: [main]
    paths:
      - "obd-simulator/android/**"
      - ".github/workflows/obd-simulator-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obd-simulator/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OBDSimulator-${{ github.run_number }}.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "obdsim-${{ github.run_number }}" "OBDSimulator-${{ github.run_number }}.apk" \
            --title "OBD Simulator build ${{ github.run_number }}" \
            --notes "Pretends to be a vLinker FD adapter and sends made up battery data, for demo videos."
