name: OceanLive
options:
  bundleIdPrefix: com.justice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.0.0"
    CURRENT_PROJECT_VERSION: "3000"
    DEVELOPMENT_TEAM: L2TJW2J666
    CODE_SIGN_STYLE: Automatic
targets:
  OceanLive:
    type: application
    platform: iOS
    sources:
      - OceanLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP
        PRODUCT_NAME: OceanLive
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: OceanLive/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSBluetoothAlwaysUsageDescription: Ocean Live reads your car's battery through your Bluetooth OBD adapter.
        ITSAppUsesNonExemptEncryption: false
schemes:
  OceanLive:
    build:
      targets:
        OceanLive: all
