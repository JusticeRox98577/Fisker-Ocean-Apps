name: OceanLive
options:
  bundleIdPrefix: com.justice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # English is the base language. XcodeGen adds de, nl, fr and es to the project's known regions
  # from the String Catalogs (Localizable.xcstrings, InfoPlist.xcstrings) in each target's folder.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.4.0"
    CURRENT_PROJECT_VERSION: "3400"
    DEVELOPMENT_TEAM: L2TJW2J666
    CODE_SIGN_STYLE: Automatic
targets:
  OceanLive:
    type: application
    platform: iOS
    sources:
      - OceanLive
      - Shared
      # Local tip products for trying the Support screen from Xcode (Run uses it, see the scheme below).
      # Only a file reference: never copied into the app. TestFlight and the App Store use the real products.
      - path: StoreKit/Tips.storekit
        buildPhase: none
    dependencies:
      - target: OceanLiveWidgets
      # Copied into OceanLive.app/Watch.
      - target: OceanLiveWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP
        PRODUCT_NAME: OceanLive
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # "Any questions?" proxy address (see ask-proxy/README.md). Empty hides the feature; CI passes
        # OCEAN_ASK_URL=https://.../ask to xcodebuild from the repository variable of the same name.
        OCEAN_ASK_URL: ""
    entitlements:
      path: OceanLive/OceanLive.entitlements
      properties:
        com.apple.developer.carplay-driving-task: true
        # Sign in with Apple for Ocean Live accounts (the App ID needs the capability too).
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.com.justice.OceanABRP
    info:
      path: OceanLive/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, nl, fr, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        # Landscape too, for a phone mounted sideways in the car: the Live screen gets its own two-pane layout.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - bluetooth-central
          # Watching the 12V while the car sleeps: an occasional refresh that only asks the adapter for its voltage.
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.justice.OceanABRP.v12refresh
        NSBluetoothAlwaysUsageDescription: Ocean Live reads your car's battery and fault codes through your Bluetooth OBD adapter.
        NSLocationWhenInUseUsageDescription: Only used when you turn on location sharing for A Better Route Planner, so ABRP can plan from where you are.
        ITSAppUsesNonExemptEncryption: false
        OceanAskURL: $(OCEAN_ASK_URL)
        # Charging progress on the lock screen, Dynamic Island, Apple Watch and CarPlay.
        NSSupportsLiveActivities: true
        # The phone window comes from SwiftUI; CarPlay gets its own scene delegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
  # Home-screen and lock-screen widgets plus the charging Live Activity.
  OceanLiveWidgets:
    type: app-extension
    platform: iOS
    # iOS 18: the Live Activity's small layout (Apple Watch, CarPlay) needs it. On iOS 17 the app works without widgets.
    deploymentTarget: "18.0"
    sources:
      - OceanLiveWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP.widgets
        PRODUCT_NAME: OceanLiveWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: OceanLiveWidgets/OceanLiveWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justice.OceanABRP
    info:
      path: OceanLiveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, nl, fr, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # Apple Watch app: shows the latest reading the phone sends it. It never talks to the car.
  OceanLiveWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - OceanLiveWatch
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP.watchkitapp
        PRODUCT_NAME: OceanLiveWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Embedded in the iPhone app, not archived on its own.
        SKIP_INSTALL: YES
    info:
      path: OceanLiveWatch/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, de, nl, fr, es]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.justice.OceanABRP
  OceanLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OceanLiveTests
    dependencies:
      - target: OceanLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OceanLive.app/OceanLive
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  OceanLive:
    build:
      targets:
        OceanLive: all
    run:
      # Xcode's local StoreKit testing for the tips; archives and TestFlight builds ignore it.
      storeKitConfiguration: StoreKit/Tips.storekit
    test:
      targets:
        - OceanLiveTests
