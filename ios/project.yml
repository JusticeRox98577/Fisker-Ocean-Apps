name: OceanLive
options:
  bundleIdPrefix: com.justice
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "3.2.0"
    CURRENT_PROJECT_VERSION: "3200"
    DEVELOPMENT_TEAM: L2TJW2J666
    CODE_SIGN_STYLE: Automatic
targets:
  OceanLive:
    type: application
    platform: iOS
    sources:
      - OceanLive
      - Shared
    dependencies:
      - target: OceanLiveWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP
        PRODUCT_NAME: OceanLive
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    entitlements:
      path: OceanLive/OceanLive.entitlements
      properties:
        com.apple.developer.carplay-driving-task: true
        com.apple.security.application-groups:
          - group.com.justice.OceanABRP
    info:
      path: OceanLive/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIBackgroundModes:
          - bluetooth-central
        NSBluetoothAlwaysUsageDescription: Ocean Live reads your car's battery and fault codes through your Bluetooth OBD adapter.
        NSLocationWhenInUseUsageDescription: Only used when you turn on location sharing for A Better Route Planner, so ABRP can plan from where you are.
        ITSAppUsesNonExemptEncryption: false
        # Charging progress on the lock screen, Dynamic Island, Apple Watch and CarPlay.
        NSSupportsLiveActivities: true
        # The phone window comes from SwiftUI; CarPlay gets its own scene delegate.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
  # Home-screen and lock-screen widgets plus the charging Live Activity.
  OceanLiveWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - OceanLiveWidgets
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP.widgets
        PRODUCT_NAME: OceanLiveWidgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    entitlements:
      path: OceanLiveWidgets/OceanLiveWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.justice.OceanABRP
    info:
      path: OceanLiveWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ocean Live
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  OceanLiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - OceanLiveTests
    dependencies:
      - target: OceanLive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.justice.OceanABRP.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OceanLive.app/OceanLive
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  OceanLive:
    build:
      targets:
        OceanLive: all
    test:
      targets:
        - OceanLiveTests
